name: Desktop cross-platform

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release:
    name: API and ERP workflow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quanti
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quanti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quanti
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/quanti
      HOST: 127.0.0.1
      PORT: 3100

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm --filter @quanti/api test
      - run: pnpm --filter @quanti/api build
      - run: pnpm --filter @quanti/desktop test
      - run: pnpm --filter @quanti/desktop build
      - name: Start API and verify ERP workflow
        shell: bash
        run: |
          pnpm --filter @quanti/api start > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true; cat api.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3100/health
          pnpm demo:seed

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quanti/desktop test
      - run: pnpm --filter @quanti/desktop build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: pnpm --filter @quanti/desktop tauri:test
      - run: pnpm --filter @quanti/desktop tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: quanti-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle
