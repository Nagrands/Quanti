name: Desktop release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release metadata and create draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify tag, manifests, changelog, and secrets
        run: node scripts/verify-release.mjs --tag "$GITHUB_REF_NAME" --require-secrets
      - name: Create or update draft release
        shell: bash
        run: |
          status="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$status" = "false" ]; then
            echo "Release $GITHUB_REF_NAME is already published; refusing to replace it." >&2
            exit 1
          fi
          if [ "$status" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft --title "Quanti $GITHUB_REF_NAME" --notes-file .quanti-build/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Quanti $GITHUB_REF_NAME" --notes-file .quanti-build/release-notes.md
          fi

  bundle:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      QUANTI_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - name: Prepare target-specific autonomous runtime
        run: node scripts/prepare-autonomous-runtime.mjs
      - name: Prepare updater configuration
        run: node scripts/prepare-release-config.mjs
      - name: Build and upload draft assets
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          projectPath: apps/desktop
          tauriScript: ./node_modules/.bin/tauri
          tagName: ${{ github.ref_name }}
          releaseName: Quanti ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          args: --config ../../.quanti-build/tauri.release.conf.json --target ${{ matrix.target }} --ci
      - name: Verify macOS bundle has no Developer ID or notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          signature="$(codesign -dv --verbose=4 "$app_path" 2>&1 || true)"
          if grep -q 'Authority=Developer ID Application' <<<"$signature"; then
            echo "Developer ID signing must be disabled for this release." >&2
            exit 1
          fi
          if xcrun stapler validate "$app_path"; then
            echo "A notarization ticket is present even though notarization must be disabled." >&2
            exit 1
          fi
      - name: Verify Windows MSI is not Authenticode-signed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) {
            throw 'Windows MSI was not produced.'
          }
          $signature = Get-AuthenticodeSignature $msi.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned MSI, received Authenticode status $($signature.Status)."
          }

  checksums:
    name: Publish release checksums
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download installer and updater assets
        shell: bash
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern '*.dmg' \
            --pattern '*.msi' \
            --pattern '*.tar.gz' \
            --pattern '*.zip' \
            --pattern '*.sig' \
            --pattern 'latest.json'
      - name: Verify complete updater manifest and asset set
        shell: bash
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = 2
          test "$(find . -maxdepth 1 -name '*.msi' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 3
          test "$(find . -maxdepth 1 -name '*.sig' | wc -l | tr -d ' ')" = 3
          jq -e '
            .version == "0.1.0" and
            (.platforms | has("darwin-aarch64")) and
            (.platforms | has("darwin-x86_64")) and
            (.platforms | has("windows-x86_64")) and
            ([.platforms[] | select((.url | startswith("https://github.com/")) and (.signature | length > 0))] | length == 3)
          ' latest.json >/dev/null
      - name: Create and upload SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
